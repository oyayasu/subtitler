name: Build Windows 10 x64
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run checks
        run: |
          python scripts/check_project.py
          npm test
      - name: Build frontend bundle
        run: |
          npm install
          npm run build:frontend
      - name: Build NSIS .exe
        run: |
          npm install --no-save '@tauri-apps/cli@^2'
          npx tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Subtitler-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.1-win10
          target_commitish: main
          name: Windows 10 x64 — v0.8.1
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
